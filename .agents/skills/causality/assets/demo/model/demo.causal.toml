[[phenomena]]
id = "platform.deployment"
kind = "event"
domain = "platform"
description = "A production deployment."
aliases = ["deploy"]

[[phenomena]]
id = "platform.latency"
kind = "signal"
domain = "platform"
description = "Request latency."
aliases = ["slow requests"]

[[phenomena]]
id = "finance.revenue"
kind = "derived"
domain = "finance"
description = "Recognized revenue."

[[phenomena]]
id = "hr.employee_birthday"
kind = "event"
domain = "hr"
description = "An intentionally isolated demo concept."

[[relations]]
id = "rel.deployment.latency"
from = ["platform.deployment"]
to = ["platform.latency"]
kind = "causal"
effect = "increase"
status = "supported"
temporal_mode = "asynchronous"
min_lag = "0s"
max_lag = "2h"
description = "Deployments can increase request latency."

[[relations]]
id = "rel.latency.revenue"
from = ["platform.latency"]
to = ["finance.revenue"]
kind = "causal"
effect = "decrease"
status = "hypothesis"
temporal_mode = "asynchronous"
min_lag = "1m"
max_lag = "1d"
description = "Latency can reduce revenue."

[[bindings]]
id = "binding.latency.current"
concept = "platform.latency"
role = "canonical"
schema = "analytics_gold"
table = "request_metrics"
time_column = "event_ts"
entity_key = "service_id"
grain_entity = "service"
grain_time = "5m"
valid_from = "2026-01-01"
estimated_rows = 8400000000
estimated_bytes = 4200000000000
partition_keys = ["event_date"]
cluster_keys = ["service_id"]
require_partition_filter = true
recommended_time_window = "7d"
query_ref = "queries/platform_latency.sql"

[bindings.null_rates]
service_id = 0.001

[[bindings]]
id = "binding.latency.legacy"
concept = "platform.latency"
role = "legacy"
schema = "legacy"
table = "latency_daily"
grain_entity = "service"
grain_time = "day"
valid_until = "2025-12-31"

[[evidence]]
id = "evidence.deployment.latency"
relation = "rel.deployment.latency"
type = "incident"
source = "INC-DEMO"
description = "Latency followed a deployment in a demo incident."

[[tests]]
kind = "path_exists"
from = "platform.deployment"
to = "finance.revenue"
max_depth = 3

[[tests]]
kind = "no_path"
from = "hr.employee_birthday"
to = "platform.latency"
max_depth = 3

[[tests]]
kind = "binding_exists"
concept = "platform.latency"
role = "canonical"
